<nav>
  <h2>{{ title() }} Navigation</h2>
  <div class="nav-buttons">
    @for (item of menuItems(); track item.path) {
      <button [routerLink]="item.path">
        {{ item.label }}
      </button>
    }
  </div>
</nav>

<hr>

<main>
  @if (true) { 
    <!-- Just demonstrating @if usage as requested, though strictly not needed for router outlet itself usually -->
    <router-outlet />
  }
</main>
